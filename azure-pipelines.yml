trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: 1.9.8
  terraformStateKey: jenkins/terraform.tfstate
  terraformStateLocation: eastus

steps:
  - checkout: self

  - task: Bash@3
    displayName: Install Terraform
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        version="$(terraformVersion)"
        install_dir="$(Agent.ToolsDirectory)/terraform/${version}/x64"
        mkdir -p "$install_dir"
        cd "$(Agent.TempDirectory)"

        archive="terraform_${version}_linux_amd64.zip"
        curl -fsSLO "https://releases.hashicorp.com/terraform/${version}/${archive}"
        curl -fsSLO "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_SHA256SUMS"
        grep " ${archive}$" "terraform_${version}_SHA256SUMS" | sha256sum --check --status
        unzip -oq "$archive" -d "$install_dir"

        echo "##vso[task.prependpath]$install_dir"
        "$install_dir/terraform" version

  - task: AzureCLI@2
    displayName: Deploy Jenkins with Terraform
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      azureSubscription: 'Gaurav Sharma'
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        require_set() {
          local name="$1"
          local value="${!name:-}"
          if [[ -z "$value" || "$value" == *'$('* ]]; then
            echo "Required Azure DevOps variable is not configured: $name" >&2
            exit 1
          fi
        }

        require_set TF_STATE_RESOURCE_GROUP
        require_set TF_STATE_STORAGE_ACCOUNT
        require_set TF_STATE_CONTAINER
        require_set TF_VAR_admin_password
        require_set TF_VAR_admin_source_cidr

        if [[ ! "$TF_STATE_STORAGE_ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]]; then
          echo "TF_STATE_STORAGE_ACCOUNT must be 3-24 lowercase letters or numbers." >&2
          exit 1
        fi

        export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
        export ARM_CLIENT_ID="${servicePrincipalId:-}"
        export ARM_TENANT_ID="${tenantId:-}"
        export ARM_USE_CLI=false
        if [[ -n "${idToken:-}" ]]; then
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN="$idToken"
        elif [[ -n "${servicePrincipalKey:-}" ]]; then
          export ARM_USE_OIDC=false
          export ARM_CLIENT_SECRET="$servicePrincipalKey"
        else
          echo "Azure service connection did not provide a federated token or client secret." >&2
          exit 1
        fi

        az group create \
          --name "$TF_STATE_RESOURCE_GROUP" \
          --location "$(terraformStateLocation)" \
          --output none

        if ! az storage account show \
          --name "$TF_STATE_STORAGE_ACCOUNT" \
          --resource-group "$TF_STATE_RESOURCE_GROUP" \
          --output none 2>/dev/null; then
          az storage account create \
            --name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --location "$(terraformStateLocation)" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --https-only true \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --output none
        fi

        state_access_key="$(az storage account keys list \
          --account-name "$TF_STATE_STORAGE_ACCOUNT" \
          --resource-group "$TF_STATE_RESOURCE_GROUP" \
          --query '[0].value' \
          --output tsv)"
        if [[ -z "$state_access_key" || "$state_access_key" == "None" ]]; then
          echo "Could not retrieve the Terraform state storage account key." >&2
          exit 1
        fi
        echo "##vso[task.setsecret]$state_access_key"
        export ARM_ACCESS_KEY="$state_access_key"

        AZURE_STORAGE_KEY="$state_access_key" az storage container create \
          --name "$TF_STATE_CONTAINER" \
          --account-name "$TF_STATE_STORAGE_ACCOUNT" \
          --auth-mode key \
          --public-access off \
          --output none

        terraform -chdir="$(Build.SourcesDirectory)" init \
          -input=false \
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=${TF_STATE_CONTAINER}" \
          -backend-config="key=$(terraformStateKey)" \
          -backend-config="use_azuread_auth=false"
        terraform -chdir="$(Build.SourcesDirectory)" fmt -check -recursive
        terraform -chdir="$(Build.SourcesDirectory)" validate
        terraform -chdir="$(Build.SourcesDirectory)" plan -input=false -out=tfplan
        terraform -chdir="$(Build.SourcesDirectory)" apply -input=false -auto-approve tfplan
    env:
      TF_IN_AUTOMATION: "true"
      TF_STATE_RESOURCE_GROUP: $(TF_STATE_RESOURCE_GROUP)
      TF_STATE_STORAGE_ACCOUNT: $(TF_STATE_STORAGE_ACCOUNT)
      TF_STATE_CONTAINER: $(TF_STATE_CONTAINER)
      TF_VAR_admin_password: $(JENKINS_ADMIN_PASSWORD)
      TF_VAR_admin_source_cidr: $(JENKINS_ADMIN_CIDR)
