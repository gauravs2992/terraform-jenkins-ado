#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - fontconfig
  - openjdk-21-jre
  - python3-pip
  - python3-venv

write_files:
  - path: /usr/local/sbin/install-jenkins-and-libraries
    owner: root:root
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      install -d -m 0755 /usr/share/keyrings
      curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key \
        -o /usr/share/keyrings/jenkins-keyring.asc
      echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" \
        > /etc/apt/sources.list.d/jenkins.list

      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y jenkins

      python3 -m venv /opt/jenkins-python/venv
      /opt/jenkins-python/venv/bin/python -m pip install --upgrade pip
      /opt/jenkins-python/venv/bin/python -m pip install python-hcl2 azure-identity azure-mgmt-resource

      install -d -m 0755 /etc/systemd/system/jenkins.service.d
      cat > /etc/systemd/system/jenkins.service.d/python-libraries.conf <<'EOF'
      [Service]
      Environment="PATH=/opt/jenkins-python/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      EOF

      systemctl daemon-reload
      systemctl enable --now jenkins
      systemctl restart jenkins

runcmd:
  - [bash, /usr/local/sbin/install-jenkins-and-libraries]
